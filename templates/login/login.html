<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Placement Portal</title>


    <!-- CSS -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">

</head>


<body>


    <main class="login-page">


        <section class="login-card">


            <!-- =========================================
                 COLLEGE LOGO
            ========================================== -->

            <div class="logo-container">

                <img
                    src="{{ url_for('static', filename='images/college-logo.jpeg') }}"
                    alt="College Logo"
                    class="college-logo">

            </div>



            <!-- =========================================
                 WELCOME SECTION
            ========================================== -->

            <div class="welcome-section">

                <h1>
                    Welcome Back
                </h1>


                <div class="subtitle-row">

                    <span></span>

                    <p>
                        Sign in to continue
                    </p>

                    <span></span>

                </div>

            </div>



            <!-- =========================================
                 SERVER SIDE FLASH MESSAGES
            ========================================== -->

            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    <div class="login-message server-message">

                        {% for message in messages %}

                            <p>{{ message }}</p>

                        {% endfor %}

                    </div>

                {% endif %}

            {% endwith %}



            <!-- =========================================
                 LOGIN FORM
            ========================================== -->

            <form
                id="loginForm"
                action="{{ url_for('login') }}"
                method="POST">


                <!-- =====================================
                     EMAIL
                ====================================== -->

                <div class="form-group">


                    <label for="email">
                        Email
                    </label>


                    <div class="input-box">


                        <!-- Email Icon -->

                        <svg
                            class="input-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8">

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"/>

                            <polyline
                                points="3 7 12 13 21 7">
                            </polyline>

                        </svg>



                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your @poornima.org email"
                            autocomplete="username"
                            pattern="[A-Za-z0-9._%+-]+@poornima\.org"
                            title="Please use your @poornima.org email address"
                            required>


                    </div>


                    <small
                        class="error-message"
                        id="emailError">
                    </small>


                </div>



                <!-- =====================================
                     PASSWORD
                ====================================== -->

                <div class="form-group">


                    <label for="password">
                        Password
                    </label>


                    <div class="input-box">


                        <!-- Lock Icon -->

                        <svg
                            class="input-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8">

                            <rect
                                x="3"
                                y="11"
                                width="18"
                                height="10"
                                rx="2"/>

                            <path
                                d="M7 11V7
                                   a5 5 0 0 1 10 0v4"/>

                        </svg>



                        <!-- Password Input -->

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>



                        <!-- Eye Button -->

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password">


                            <!-- Eye Icon -->

                            <svg
                                id="eyeIcon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8">


                                <path
                                    d="M2 12
                                       C4.5 7.5 8 5.5 12 5.5
                                       C16 5.5 19.5 7.5 22 12
                                       C19.5 16.5 16 18.5 12 18.5
                                       C8 18.5 4.5 16.5 2 12Z"/>


                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"/>


                            </svg>


                        </button>


                    </div>


                    <small
                        class="error-message"
                        id="passwordError">
                    </small>


                </div>



                <!-- =====================================
                     REMEMBER ME + FORGOT PASSWORD
                ====================================== -->

                <div class="form-options">


                    <label class="remember-me">


                        <input
                            type="checkbox"
                            id="rememberMe"
                            name="remember_me">


                        <span
                            class="custom-checkbox">
                        </span>


                        <span>
                            Remember me
                        </span>


                    </label>



                    <a
                        href="#"
                        id="forgotPassword">

                        Forgot Password?

                    </a>


                </div>



                <!-- =====================================
                     LOGIN BUTTON
                ====================================== -->

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton">


                    <span>
                        Login
                    </span>


                    <!-- Arrow -->

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2">

                        <line
                            x1="5"
                            y1="12"
                            x2="19"
                            y2="12"/>

                        <polyline
                            points="12 5 19 12 12 19"/>

                    </svg>


                </button>



                <!-- Client-side Login Message -->

                <p
                    id="loginMessage"
                    class="login-message">
                </p>


            </form>



            <!-- =========================================
                 FOOTER
            ========================================== -->

            <div class="login-footer">


                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8">

                    <path
                        d="M12 22s8-4 8-10V5l-8-3-8 3v7
                           c0 6 8 10 8 10z"/>

                    <polyline
                        points="9 12 11 14 15 10"/>

                </svg>


                <span>
                    Secure
                </span>


                <b>•</b>


                <span>
                    Reliable
                </span>


                <b>•</b>


                <span>
                    Integrated
                </span>


            </div>


        </section>


    </main>



    <!-- JavaScript -->

    <script
        src="{{ url_for('static', filename='js/login.js') }}">
    </script>


</body>

</html>
