<header class="authority-topbar" id="authorityTopbar">

    <!-- =====================================================
         LEFT SIDE
    ====================================================== -->

    <div class="topbar-left">

        <!-- MOBILE MENU -->

        <button
            type="button"
            class="mobile-menu-btn"
            id="mobileMenuBtn"
            aria-label="Open navigation"
        >
            ☰
        </button>


        <!-- SEARCH -->

        <div class="authority-search">

            <span class="search-icon">
                ⌕
            </span>

            <input
                type="text"
                id="authoritySearch"
                placeholder="Search for drives, companies, reports..."
                autocomplete="off"
            >

            <span class="search-shortcut">
                Ctrl + K
            </span>

        </div>

    </div>


    <!-- =====================================================
         RIGHT SIDE
    ====================================================== -->

    <div class="topbar-right">


        <!-- THEME -->

        <button
            type="button"
            class="topbar-action-btn"
            id="headerThemeBtn"
            title="Toggle theme"
            aria-label="Toggle theme"
        >
            ☼
        </button>


        <!-- NOTIFICATIONS -->

        <button
            type="button"
            class="topbar-action-btn notification-btn"
            id="notificationTopbarBtn"
            title="Notifications"
            aria-label="Notifications"
        >

            ♢

            <span class="notification-badge">
                5
            </span>

        </button>


        <!-- DIVIDER -->

        <span class="topbar-divider"></span>


        <!-- =================================================
             AUTHORITY PROFILE
        ================================================== -->

        <div
            class="authority-profile"
            id="authorityProfile"
        >

            <!-- AVATAR -->

            <div class="authority-avatar">
                A
            </div>


            <!-- DETAILS -->

            <div class="authority-profile-info">

                <strong>
                    College Authority
                </strong>

                <span>
                    Principal / Director
                </span>

            </div>


            <!-- ARROW -->

            <span class="profile-arrow">
                ⌄
            </span>

        </div>

    </div>

</header>
