<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Authority | Campus Placement Portal
        {% endblock %}
    </title>


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         COMMON AUTHORITY CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/authority/common.css'
        ) }}"
    >


    <!-- =====================================================
         PAGE SPECIFIC CSS
    ====================================================== -->

    {% block page_css %}
    {% endblock %}

</head>


<body>


    <!-- =====================================================
         AUTHORITY APP
    ====================================================== -->

    <div class="authority-app">


        <!-- =================================================
             COMMON SIDEBAR
        ================================================== -->

        {% include "authority/components/sidebar.html" %}


        <!-- =================================================
             MAIN CONTENT AREA
        ================================================== -->

        <main class="authority-main">


            <!-- =============================================
                 COMMON TOPBAR
            ============================================== -->

            {% include "authority/components/topbar.html" %}


            <!-- =============================================
                 PAGE CONTENT
            ============================================== -->

            <div class="authority-page">

                {% block content %}
                {% endblock %}

            </div>


        </main>


    </div>


    <!-- =====================================================
         COMMON AUTHORITY JS
    ====================================================== -->

    <script
        src="{{ url_for(
            'static',
            filename='js/authority/common.js'
        ) }}"
    ></script>


    <!-- =====================================================
         PAGE SPECIFIC JS
    ====================================================== -->

    {% block page_js %}
    {% endblock %}


</body>

</html>
